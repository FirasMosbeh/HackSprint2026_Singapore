[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audition"
version = "0.1.0"
description = "Which library is actually best for your use case?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # stdlib only: the tool must run inside a bare machine

[project.optional-dependencies]
daytona = ["daytona"]

[project.scripts]
audition = "audition.cli:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
